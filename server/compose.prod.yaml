name: watch-together-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watch_together}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-watch_together_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-postgres-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watch_together}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-watch_together_prod}
      MEDIA_POSTGRES_DB: ${MEDIA_POSTGRES_DB:-watch_together_media_prod}
    entrypoint: >
      /bin/sh -c "
      if ! psql -h postgres -U \"$${POSTGRES_USER}\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${MEDIA_POSTGRES_DB}'\" | grep -q 1; then
        createdb -h postgres -U \"$${POSTGRES_USER}\" \"$${MEDIA_POSTGRES_DB}\";
      fi;
      "

  timeline-postgres-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-watch_together}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-watch_together_prod}
      TIMELINE_POSTGRES_DB: ${TIMELINE_POSTGRES_DB:-watch_together_timeline_prod}
    entrypoint: >
      /bin/sh -c "
      if ! psql -h postgres -U \"$${POSTGRES_USER}\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${TIMELINE_POSTGRES_DB}'\" | grep -q 1; then
        createdb -h postgres -U \"$${POSTGRES_USER}\" \"$${TIMELINE_POSTGRES_DB}\";
      fi;
      "

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_password}
    command: redis-server --appendonly yes --port 6380 --requirepass ${REDIS_PASSWORD:-change_me_redis_password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6380 -a \"$${REDIS_PASSWORD:-change_me_redis_password}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-watch-together-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        sleep 1;
      done;
      mc mb -p \"local/$${MEDIA_STORAGE_BUCKET}\" || true;
      mc anonymous set download \"local/$${MEDIA_STORAGE_BUCKET}\";
      "

  roomserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      kafka:
        condition: service_started
      roomservice:
        condition: service_started
      mediaservice:
        condition: service_started
      timelineservice:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOG_LEVEL: info
      SERVER_INSTANCE_ID: ${SERVER_INSTANCE_ID:-roomserver-prod-1}
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      DEBUG_SYNC: "false"
      WS_CROSS_INSTANCE_BROADCAST_ENABLED: ${WS_CROSS_INSTANCE_BROADCAST_ENABLED:-false}
      WS_EVENT_BUS: ${WS_EVENT_BUS:-nats_core}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_NAME: ${NATS_NAME:-watch-together-roomserver}
      NATS_SUBJECT_ROOM_BROADCAST: ${NATS_SUBJECT_ROOM_BROADCAST:-wt.room.broadcast.v1}
      NATS_SUBJECT_ROOM_CONTROL: ${NATS_SUBJECT_ROOM_CONTROL:-wt.room.control.v1}
      CONTROL_IDEMPOTENCY_TTL_MS: ${CONTROL_IDEMPOTENCY_TTL_MS:-600000}
      PRESENCE_LEASE_TTL_MS: ${PRESENCE_LEASE_TTL_MS:-45000}
      PRESENCE_REFRESH_INTERVAL_MS: ${PRESENCE_REFRESH_INTERVAL_MS:-15000}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-roomserver}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      AUTHORITY_RENEW_INTERVAL_MS: ${AUTHORITY_RENEW_INTERVAL_MS:-10000}
      AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS: ${AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS:-30000}
      AUTHORITY_RECOVERY_TIMEOUT_MS: ${AUTHORITY_RECOVERY_TIMEOUT_MS:-5000}
      KAFKA_REPLAY_TIMEOUT_MS: ${KAFKA_REPLAY_TIMEOUT_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${ROOMSERVER_METRICS_ADDR:-}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      SERVICE_NAME: ${SERVICE_NAME:-watch-together-roomserver}
      SERVICE_VERSION: ${SERVICE_VERSION:-prod}
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_TIMEOUT_MS: ${INTERNAL_RPC_TIMEOUT_MS:-1000}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-change_me_internal_rpc_token}
      SERVICE_DISCOVERY_MODE: ${SERVICE_DISCOVERY_MODE:-static}
      ROOM_SERVICE_MODE: ${ROOM_SERVICE_MODE:-rpc}
      ROOM_SERVICE_ADDR: ${ROOM_SERVICE_ADDR:-http://roomservice:8090}
      MEDIA_SERVICE_MODE: ${MEDIA_SERVICE_MODE:-rpc}
      MEDIA_SERVICE_ADDR: ${MEDIA_SERVICE_ADDR:-http://mediaservice:8090}
      MEDIA_DATABASE_URL: ${ROOMSERVER_MEDIA_DATABASE_URL:-}
      TIMELINE_SERVICE_MODE: ${TIMELINE_SERVICE_MODE:-rpc}
      TIMELINE_SERVICE_ADDR: ${TIMELINE_SERVICE_ADDR:-http://timelineservice:8090}
      TIMELINE_DATABASE_URL: ${ROOMSERVER_TIMELINE_DATABASE_URL:-}
      AUTHORITY_SERVICE_MODE: ${AUTHORITY_SERVICE_MODE:-local}
      AUTHORITY_SERVICE_ADDR: ${AUTHORITY_SERVICE_ADDR:-}
      AUTHORITY_LEASE_INSTANCE_ID: ${AUTHORITY_LEASE_INSTANCE_ID:-}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-watch-together-roomserver}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-watch_together_prod}?sslmode=disable
      REDIS_ADDR: redis:6380
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change_me_redis_password}
      REDIS_DB: 0
      REDIS_REQUIRED: "true"
      MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-nginx_auth_request}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://localhost/watch-together-media}
      MEDIA_INTERNAL_BASE_URL: http://minio:9000/${MEDIA_STORAGE_BUCKET:-watch-together-media}
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-watch-together-media}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-auto}
      MEDIA_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"

  outboxworker:
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      timeline-postgres-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-watch_together_prod}?sslmode=disable
      TIMELINE_DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${TIMELINE_POSTGRES_DB:-watch_together_timeline_prod}?sslmode=disable
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-outboxworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      OUTBOX_WORKER_POLL_INTERVAL_MS: ${OUTBOX_WORKER_POLL_INTERVAL_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${OUTBOX_WORKER_METRICS_ADDR:-:9091}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
    command: ["/app/outboxworker"]

  derivedworker:
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-derivedworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${DERIVED_WORKER_METRICS_ADDR:-:9093}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
    command: ["/app/derivedworker"]

  mediaservice:
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      media-postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      SERVICE_NAME: watch-together-mediaservice
      SERVICE_VERSION: ${SERVICE_VERSION:-prod}
      INTERNAL_RPC_ADDR: :8090
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-change_me_internal_rpc_token}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-watch_together_prod}?sslmode=disable
      MEDIA_DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${MEDIA_POSTGRES_DB:-watch_together_media_prod}?sslmode=disable
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-watch-together-media}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-auto}
      MEDIA_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"
    command: ["/app/mediaservice"]

  roomservice:
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mediaservice:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      SERVICE_NAME: watch-together-roomservice
      SERVICE_VERSION: ${SERVICE_VERSION:-prod}
      INTERNAL_RPC_ADDR: :8090
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_TIMEOUT_MS: ${INTERNAL_RPC_TIMEOUT_MS:-1000}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-change_me_internal_rpc_token}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-watch_together_prod}?sslmode=disable
      MEDIA_SERVICE_MODE: rpc
      MEDIA_SERVICE_ADDR: http://mediaservice:8090
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-watch-together-roomservice}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
    command: ["/app/roomservice"]

  timelineservice:
    image: watch-together-roomserver:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      timeline-postgres-init:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      SERVICE_NAME: watch-together-timelineservice
      SERVICE_VERSION: ${SERVICE_VERSION:-prod}
      INTERNAL_RPC_ADDR: :8090
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-change_me_internal_rpc_token}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${POSTGRES_DB:-watch_together_prod}?sslmode=disable
      TIMELINE_DATABASE_URL: postgres://${POSTGRES_USER:-watch_together}:${POSTGRES_PASSWORD:-change_me_postgres_password}@postgres:5432/${TIMELINE_POSTGRES_DB:-watch_together_timeline_prod}?sslmode=disable
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-timelineservice}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_REPLAY_TIMEOUT_MS: ${KAFKA_REPLAY_TIMEOUT_MS:-1000}
    command: ["/app/timelineservice"]

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: watch-together-nginx:${WATCH_TOGETHER_IMAGE_TAG:-prod}
    restart: unless-stopped
    depends_on:
      - roomserver
      - minio
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
