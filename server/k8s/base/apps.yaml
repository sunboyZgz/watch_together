          command: ["/app/roomauthorityservice"]
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: APP_ENV
              value: local
            - name: SERVICE_NAME
              value: watch-together-roomauthorityservice
            - name: SERVICE_VERSION
              value: kind
            - name: SERVER_INSTANCE_ID
              value: roomauthorityservice-1
            - name: DEBUG_SYNC
              value: "true"
            - name: INTERNAL_RPC_ADDR
              value: :8090
            - name: INTERNAL_RPC_PATH_PREFIX
              value: /internal.rpc
            - name: INTERNAL_RPC_TIMEOUT_MS
              value: "10000"
            - name: TIMELINE_SERVICE_MODE
              value: rpc
            - name: TIMELINE_SERVICE_ADDR
              value: http://timelineservice:8090
            - name: ROOM_SERVICE_MODE
              value: rpc
            - name: ROOM_SERVICE_ADDR
              value: http://roomservice:8090
            - name: WS_CROSS_INSTANCE_BROADCAST_ENABLED
              value: "true"
            - name: WS_EVENT_BUS
              value: nats_core
            - name: NATS_URL
              value: nats://nats:4222
            - name: NATS_NAME
              value: watch-together-roomauthorityservice
            - name: NATS_SUBJECT_ROOM_BROADCAST
              value: wt.room.broadcast.v1
            - name: CONTROL_IDEMPOTENCY_TTL_MS
              value: "600000"
            - name: WS_SEEK_MIN_INTERVAL_MS
              value: "250"
            - name: AUTHORITY_RENEW_INTERVAL_MS
              value: "10000"
            - name: AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS
              value: "30000"
            - name: AUTHORITY_RECOVERY_TIMEOUT_MS
              value: "5000"
            - name: METRICS_ENABLED
              value: "true"
            - name: METRICS_PATH
              value: /metrics
            - name: READINESS_PATH
              value: /readyz
            - name: REDIS_ADDR
              value: redis:6380
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watch-together-secret
                  key: redis-password
            - name: REDIS_DB
              value: "0"
            - name: REDIS_REQUIRED
              value: "true"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: roomauthorityservice
spec:
  selector:
    app.kubernetes.io/name: roomauthorityservice
  ports:
    - name: http
      port: 8090
      targetPort: 8090
