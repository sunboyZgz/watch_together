apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-main
  labels:
    app.kubernetes.io/part-of: watch-together
    watch-together/job-phase: migration
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: watch-together
        watch-together/job-phase: migration
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - until pg_isready -h postgres -U app -d anime_watch_dev; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: watch-together-secret
                  key: postgres-password
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          imagePullPolicy: IfNotPresent
          args:
            - -path=/migrations
            - -database=postgres://app:app@postgres:5432/anime_watch_dev?sslmode=disable
            - up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: migrations-main
---
