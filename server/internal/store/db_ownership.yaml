version: 1

store_files:
  postgres.go: identity
  media_postgres.go: media
  room_postgres.go: room-session
  progress_postgres.go: progress
  room_timeline_outbox.go: timeline
  home_postgres.go: home-composition

tables:
  users:
    owner: identity
    writers: [identity]
    readers: [identity, home-composition]
  media_tags:
    owner: media
    writers: [media]
    readers: [media]
  media_seasons:
    owner: media
    writers: [media]
    readers: [media]
  media_episodes:
    owner: media
    writers: [media]
    readers: [media]
  media_episode_variants:
    owner: media
    writers: [media]
    readers: [media]
  media_season_tags:
    owner: media
    writers: [media]
    readers: [media]
  rooms:
    owner: room-session
    writers: [room-session]
    readers: [room-session]
  room_members:
    owner: room-session
    writers: [room-session]
    readers: [room-session]
  user_media_progress:
    owner: progress
    writers: [progress]
    readers: [progress, home-composition]
  room_timeline_outbox:
    owner: timeline
    writers: [timeline]
    readers: [timeline]
  media_items:
    owner: media
    writers: [media]
    readers: [media]
    status: retired
  media_item_tags:
    owner: media
    writers: [media]
    readers: [media]
    status: retired

cross_context_access:
  - caller: home-composition
    owner: identity
    tables: [users]
    access: read
    path: home_postgres.go
    reason: home profile summary read model
  - caller: home-composition
    owner: progress
    tables: [user_media_progress]
    access: read
    path: home_postgres.go
    reason: continue-watching progress read model
