services:
  postgres:
    image: postgres:16
    container_name: anime-watch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: anime_watch_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  identity-postgres-init:
    profiles: ["app", "services", "rpc-pilot"]
    image: postgres:16
    container_name: anime-watch-identity-postgres-init
    depends_on:
      - postgres
    restart: "no"
    environment:
      PGPASSWORD: app
      IDENTITY_POSTGRES_DB: ${IDENTITY_POSTGRES_DB:-anime_watch_identity_dev}
    entrypoint: >
      /bin/sh -c "
      until pg_isready -h postgres -U app -d anime_watch_dev; do
        sleep 1;
      done;
      if ! psql -h postgres -U app -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${IDENTITY_POSTGRES_DB:-anime_watch_identity_dev}'\" | grep -q 1; then
        createdb -h postgres -U app \"$${IDENTITY_POSTGRES_DB:-anime_watch_identity_dev}\";
      fi;
      "
  media-postgres-init:
    profiles: ["app", "services", "rpc-pilot"]
    image: postgres:16
    container_name: anime-watch-media-postgres-init
    depends_on:
      - postgres
    restart: "no"
    environment:
      PGPASSWORD: app
    entrypoint: >
      /bin/sh -c "
      until pg_isready -h postgres -U app -d anime_watch_dev; do
        sleep 1;
      done;
      if ! psql -h postgres -U app -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = 'anime_watch_media_dev'\" | grep -q 1; then
        createdb -h postgres -U app anime_watch_media_dev;
      fi;
      "
  timeline-postgres-init:
    profiles: ["app", "services", "rpc-pilot"]
    image: postgres:16
    container_name: anime-watch-timeline-postgres-init
    depends_on:
      - postgres
    restart: "no"
    environment:
      PGPASSWORD: app
      TIMELINE_POSTGRES_DB: ${TIMELINE_POSTGRES_DB:-anime_watch_timeline_dev}
    entrypoint: >
      /bin/sh -c "
      until pg_isready -h postgres -U app -d anime_watch_dev; do
        sleep 1;
      done;
      if ! psql -h postgres -U app -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${TIMELINE_POSTGRES_DB:-anime_watch_timeline_dev}'\" | grep -q 1; then
        createdb -h postgres -U app \"$${TIMELINE_POSTGRES_DB:-anime_watch_timeline_dev}\";
      fi;
      "
  progress-postgres-init:
    profiles: ["app", "services", "rpc-pilot"]
    image: postgres:16
    container_name: anime-watch-progress-postgres-init
    depends_on:
      - postgres
    restart: "no"
    environment:
      PGPASSWORD: app
      PROGRESS_POSTGRES_DB: ${PROGRESS_POSTGRES_DB:-anime_watch_progress_dev}
    entrypoint: >
      /bin/sh -c "
      until pg_isready -h postgres -U app -d anime_watch_dev; do
        sleep 1;
      done;
      if ! psql -h postgres -U app -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${PROGRESS_POSTGRES_DB:-anime_watch_progress_dev}'\" | grep -q 1; then
        createdb -h postgres -U app \"$${PROGRESS_POSTGRES_DB:-anime_watch_progress_dev}\";
      fi;
      "
  room-postgres-init:
    profiles: ["app", "services", "rpc-pilot"]
    image: postgres:16
    container_name: anime-watch-room-postgres-init
    depends_on:
      - postgres
    restart: "no"
    environment:
      PGPASSWORD: app
      ROOM_POSTGRES_DB: ${ROOM_POSTGRES_DB:-anime_watch_room_dev}
    entrypoint: >
      /bin/sh -c "
      until pg_isready -h postgres -U app -d anime_watch_dev; do
        sleep 1;
      done;
      if ! psql -h postgres -U app -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$${ROOM_POSTGRES_DB:-anime_watch_room_dev}'\" | grep -q 1; then
        createdb -h postgres -U app \"$${ROOM_POSTGRES_DB:-anime_watch_room_dev}\";
      fi;
      "
  redis:
    image: redis:7.2-alpine
    container_name: anime-watch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --port 6380 --requirepass ${REDIS_PASSWORD:-watch_together_redis_dev}
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
  nats:
    image: nats:2.10-alpine
    container_name: anime-watch-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
  kafka:
    image: bitnami/kafka:3.7
    container_name: anime-watch-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
  otel-collector:
    profiles: ["observability", "rpc-pilot"]
    image: otel/opentelemetry-collector-contrib:0.126.0
    container_name: anime-watch-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318"
      - "4317:4317"
  minio:
    image: quay.io/minio/minio:latest
    container_name: anime-watch-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: anime-watch-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb -p local/watch-together-media || true;
      mc anonymous set download local/watch-together-media;
      "

  roomserver: &roomserver_base
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: watch-together-roomserver:dev
    container_name: anime-watch-roomserver
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - nats
      - kafka
      - minio-init
      - identityservice
      - roomservice
      - mediaservice
      - progressservice
      - homecompositionservice
      - timelineservice
      - roomauthorityservice
    env_file:
      - .env
    environment: &roomserver_environment
      APP_ENV: local
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOG_LEVEL: debug
      SERVER_INSTANCE_ID: ${SERVER_INSTANCE_ID:-local-roomserver-1}
      SERVER_EDGE_MODE: ${ROOMSERVER_EDGE_MODE:-session_gateway}
      ROOM_RUNTIME_MODE: ${ROOMSERVER_RUNTIME_MODE:-distributed_authority}
      DEBUG_SYNC: "true"
      WS_CROSS_INSTANCE_BROADCAST_ENABLED: ${ROOMSERVER_WS_CROSS_INSTANCE_BROADCAST_ENABLED:-true}
      WS_EVENT_BUS: ${WS_EVENT_BUS:-nats_core}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_NAME: ${NATS_NAME:-watch-together-roomserver}
      NATS_SUBJECT_ROOM_BROADCAST: ${NATS_SUBJECT_ROOM_BROADCAST:-wt.room.broadcast.v1}
      NATS_SUBJECT_ROOM_CONTROL: ${NATS_SUBJECT_ROOM_CONTROL:-wt.room.control.v1}
      CONTROL_IDEMPOTENCY_TTL_MS: ${CONTROL_IDEMPOTENCY_TTL_MS:-600000}
      PRESENCE_LEASE_TTL_MS: ${PRESENCE_LEASE_TTL_MS:-45000}
      PRESENCE_REFRESH_INTERVAL_MS: ${PRESENCE_REFRESH_INTERVAL_MS:-15000}
      WS_DRAIN_GRACE_MS: ${WS_DRAIN_GRACE_MS:-8000}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-roomserver}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      AUTHORITY_RENEW_INTERVAL_MS: ${AUTHORITY_RENEW_INTERVAL_MS:-10000}
      AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS: ${AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS:-30000}
      AUTHORITY_RECOVERY_TIMEOUT_MS: ${AUTHORITY_RECOVERY_TIMEOUT_MS:-5000}
      KAFKA_REPLAY_TIMEOUT_MS: ${KAFKA_REPLAY_TIMEOUT_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${ROOMSERVER_METRICS_ADDR:-}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      SERVICE_NAME: ${SERVICE_NAME:-watch-together-roomserver}
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_TIMEOUT_MS: ${INTERNAL_RPC_TIMEOUT_MS:-1000}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-}
      SERVICE_DISCOVERY_MODE: ${SERVICE_DISCOVERY_MODE:-static}
      IDENTITY_SERVICE_MODE: ${ROOMSERVER_IDENTITY_SERVICE_MODE:-rpc}
      IDENTITY_SERVICE_ADDR: ${ROOMSERVER_IDENTITY_SERVICE_ADDR:-http://identityservice:8090}
      IDENTITY_DATABASE_URL: ${ROOMSERVER_IDENTITY_DATABASE_URL:-}
      ROOM_SERVICE_MODE: ${ROOMSERVER_ROOM_SERVICE_MODE:-rpc}
      ROOM_SERVICE_ADDR: ${ROOMSERVER_ROOM_SERVICE_ADDR:-http://roomservice:8090}
      ROOM_DATABASE_URL: ${ROOMSERVER_ROOM_DATABASE_URL:-}
      MEDIA_SERVICE_MODE: ${ROOMSERVER_MEDIA_SERVICE_MODE:-rpc}
      MEDIA_SERVICE_ADDR: ${ROOMSERVER_MEDIA_SERVICE_ADDR:-http://mediaservice:8090}
      MEDIA_DATABASE_URL: ${ROOMSERVER_MEDIA_DATABASE_URL:-}
      PROGRESS_SERVICE_MODE: ${ROOMSERVER_PROGRESS_SERVICE_MODE:-rpc}
      PROGRESS_SERVICE_ADDR: ${ROOMSERVER_PROGRESS_SERVICE_ADDR:-http://progressservice:8090}
      PROGRESS_DATABASE_URL: ${ROOMSERVER_PROGRESS_DATABASE_URL:-}
      HOME_SERVICE_MODE: ${ROOMSERVER_HOME_SERVICE_MODE:-rpc}
      HOME_SERVICE_ADDR: ${ROOMSERVER_HOME_SERVICE_ADDR:-http://homecompositionservice:8090}
      TIMELINE_SERVICE_MODE: ${ROOMSERVER_TIMELINE_SERVICE_MODE:-rpc}
      TIMELINE_SERVICE_ADDR: ${ROOMSERVER_TIMELINE_SERVICE_ADDR:-http://timelineservice:8090}
      TIMELINE_DATABASE_URL: ${ROOMSERVER_TIMELINE_DATABASE_URL:-}
      AUTHORITY_SERVICE_MODE: ${ROOMSERVER_AUTHORITY_SERVICE_MODE:-rpc}
      AUTHORITY_SERVICE_ADDR: ${ROOMSERVER_AUTHORITY_SERVICE_ADDR:-http://roomauthorityservice:8090}
      AUTHORITY_LEASE_INSTANCE_ID: ${ROOMSERVER_AUTHORITY_LEASE_INSTANCE_ID:-roomauthorityservice-1}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-watch-together-roomserver}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-watch_together_local_dev_jwt_secret_change_me}
      DATABASE_URL: ""
      REDIS_ADDR: redis:6380
      REDIS_PASSWORD: ${REDIS_PASSWORD:-watch_together_redis_dev}
      REDIS_DB: 0
      REDIS_REQUIRED: ${ROOMSERVER_REDIS_REQUIRED:-true}
      MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-nginx_auth_request}
      MEDIA_PLAYBACK_SIGNING_SECRET: ${MEDIA_PLAYBACK_SIGNING_SECRET:-watch_together_local_dev_media_playback_secret_change_me}
      MEDIA_INTERNAL_BASE_URL: http://minio:9000/watch-together-media
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_BUCKET: watch-together-media
      MEDIA_STORAGE_REGION: auto
      MEDIA_STORAGE_ACCESS_KEY_ID: minioadmin
      MEDIA_STORAGE_SECRET_ACCESS_KEY: minioadmin
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"
    ports:
      - "8098:8080"

  roomserver-rolling:
    <<: *roomserver_base
    profiles: ["rolling-smoke"]
    container_name: anime-watch-roomserver-rolling
    environment:
      <<: *roomserver_environment
      SERVER_INSTANCE_ID: local-roomserver-2
      NATS_NAME: watch-together-roomserver-rolling
      KAFKA_CLIENT_ID: watch-together-roomserver-rolling
      SERVICE_NAME: watch-together-roomserver-rolling
      OTEL_SERVICE_NAME: watch-together-roomserver-rolling
    ports:
      - "8099:8080"

  apigateway:
    profiles: ["app"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-apigateway
    restart: unless-stopped
    depends_on:
      - identityservice
      - roomservice
      - mediaservice
      - progressservice
      - homecompositionservice
      - roomauthorityservice
      - minio-init
    env_file:
      - .env
    environment:
      APP_ENV: local
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_EDGE_MODE: api_gateway
      ROOM_RUNTIME_MODE: local_process
      DEBUG_SYNC: "true"
      WS_CROSS_INSTANCE_BROADCAST_ENABLED: "false"
      NATS_URL: ""
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${APIGATEWAY_METRICS_ADDR:-}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      SERVICE_NAME: watch-together-apigateway
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_TIMEOUT_MS: ${INTERNAL_RPC_TIMEOUT_MS:-1000}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-}
      SERVICE_DISCOVERY_MODE: ${SERVICE_DISCOVERY_MODE:-static}
      IDENTITY_SERVICE_MODE: rpc
      IDENTITY_SERVICE_ADDR: http://identityservice:8090
      IDENTITY_DATABASE_URL: ""
      ROOM_SERVICE_MODE: rpc
      ROOM_SERVICE_ADDR: http://roomservice:8090
      ROOM_DATABASE_URL: ""
      MEDIA_SERVICE_MODE: rpc
      MEDIA_SERVICE_ADDR: http://mediaservice:8090
      MEDIA_DATABASE_URL: ""
      PROGRESS_SERVICE_MODE: rpc
      PROGRESS_SERVICE_ADDR: http://progressservice:8090
      PROGRESS_DATABASE_URL: ""
      HOME_SERVICE_MODE: rpc
      HOME_SERVICE_ADDR: http://homecompositionservice:8090
      TIMELINE_SERVICE_MODE: local
      TIMELINE_SERVICE_ADDR: ""
      TIMELINE_DATABASE_URL: ""
      AUTHORITY_SERVICE_MODE: rpc
      AUTHORITY_SERVICE_ADDR: http://roomauthorityservice:8090
      AUTHORITY_LEASE_INSTANCE_ID: ${ROOMSERVER_AUTHORITY_LEASE_INSTANCE_ID:-roomauthorityservice-1}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-watch_together_local_dev_jwt_secret_change_me}
      DATABASE_URL: ""
      REDIS_ADDR: ""
      REDIS_REQUIRED: "false"
      MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-nginx_auth_request}
      MEDIA_PLAYBACK_SIGNING_SECRET: ${MEDIA_PLAYBACK_SIGNING_SECRET:-watch_together_local_dev_media_playback_secret_change_me}
      MEDIA_INTERNAL_BASE_URL: http://minio:9000/watch-together-media
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_BUCKET: watch-together-media
      MEDIA_STORAGE_REGION: auto
      MEDIA_STORAGE_ACCESS_KEY_ID: minioadmin
      MEDIA_STORAGE_SECRET_ACCESS_KEY: minioadmin
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"
    ports:
      - "8097:8080"
    command: ["/app/apigateway"]

  roomserver-rpc-pilot:
    <<: *roomserver_base
    profiles: ["rpc-pilot"]
    container_name: anime-watch-roomserver-rpc-pilot
    depends_on:
      - postgres
      - redis
      - nats
      - kafka
      - minio-init
      - identityservice
      - roomservice
      - mediaservice
      - progressservice
      - homecompositionservice
      - timelineservice
      - roomauthorityservice
    environment:
      <<: *roomserver_environment
      SERVER_INSTANCE_ID: ${SERVER_INSTANCE_ID:-local-roomserver-1}
      ROOM_RUNTIME_MODE: ${ROOMSERVER_RUNTIME_MODE:-distributed_authority}
      WS_CROSS_INSTANCE_BROADCAST_ENABLED: ${ROOMSERVER_WS_CROSS_INSTANCE_BROADCAST_ENABLED:-true}
      REDIS_REQUIRED: "true"
      AUTHORITY_SERVICE_MODE: rpc
      AUTHORITY_SERVICE_ADDR: http://roomauthorityservice:8090
      AUTHORITY_LEASE_INSTANCE_ID: ${ROOMSERVER_AUTHORITY_LEASE_INSTANCE_ID:-roomauthorityservice-1}

  identityservice:
    profiles: ["app", "services", "rpc-pilot"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-identityservice
    restart: unless-stopped
    depends_on:
      - postgres
      - identity-postgres-init
    env_file:
      - .env
    environment:
      APP_ENV: local
      SERVICE_NAME: watch-together-identityservice
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      INTERNAL_RPC_ADDR: :8090
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-watch_together_local_dev_jwt_secret_change_me}
      AUTH_ACCESS_TOKEN_TTL_HOURS: ${AUTH_ACCESS_TOKEN_TTL_HOURS:-24}
      DATABASE_URL: ""
      IDENTITY_DATABASE_URL: postgres://app:app@postgres:5432/${IDENTITY_POSTGRES_DB:-anime_watch_identity_dev}?sslmode=disable
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-watch-together-identityservice}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
    ports:
      - "8093:8090"
    command: ["/app/identityservice"]

  roomservice:
    profiles: ["app", "services", "rpc-pilot"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-roomservice
    restart: unless-stopped
    depends_on:
      - postgres
      - room-postgres-init
      - identityservice
      - mediaservice
    env_file:
      - .env
    environment:
      APP_ENV: local
      SERVICE_NAME: watch-together-roomservice
      SERVICE_VERSION: ${SERVICE_VERSION:-dev}
      INTERNAL_RPC_ADDR: :8090
      INTERNAL_RPC_PATH_PREFIX: ${INTERNAL_RPC_PATH_PREFIX:-/internal.rpc}
      INTERNAL_RPC_TIMEOUT_MS: ${INTERNAL_RPC_TIMEOUT_MS:-1000}
      INTERNAL_RPC_AUTH_TOKEN: ${INTERNAL_RPC_AUTH_TOKEN:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      DATABASE_URL: ""
      ROOM_DATABASE_URL: postgres://app:app@postgres:5432/${ROOM_POSTGRES_DB:-anime_watch_room_dev}?sslmode=disable
      IDENTITY_SERVICE_MODE: rpc
      IDENTITY_SERVICE_ADDR: http://identityservice:8090
      MEDIA_SERVICE_MODE: rpc
      MEDIA_SERVICE_ADDR: http://mediaservice:8090
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-watch-together-roomservice}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
    ports:
      - "8094:8090"
    command: ["/app/roomservice"]

  outboxworker:
    profiles: ["app"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-outboxworker
    restart: unless-stopped
    depends_on:
      - postgres
      - timeline-postgres-init
      - kafka
    env_file:
      - .env
    environment:
      APP_ENV: local
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      DATABASE_URL: ""
      TIMELINE_DATABASE_URL: postgres://app:app@postgres:5432/${TIMELINE_POSTGRES_DB:-anime_watch_timeline_dev}?sslmode=disable
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-outboxworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      OUTBOX_WORKER_POLL_INTERVAL_MS: ${OUTBOX_WORKER_POLL_INTERVAL_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${OUTBOX_WORKER_METRICS_ADDR:-:9091}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
    command: ["/app/outboxworker"]

  derivedworker:
    profiles: ["app"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-derivedworker
    restart: unless-stopped
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      APP_ENV: local
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-derivedworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
