services:
  postgres:
    image: postgres:16
    container_name: anime-watch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: anime_watch_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7.2-alpine
    container_name: anime-watch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --port 6380 --requirepass ${REDIS_PASSWORD:-watch_together_redis_dev}
    ports:
      - "6380:6380"
    volumes:
      - redis_data:/data
  nats:
    image: nats:2.10-alpine
    container_name: anime-watch-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
  kafka:
    image: bitnami/kafka:3.7
    container_name: anime-watch-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
  minio:
    image: quay.io/minio/minio:latest
    container_name: anime-watch-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: anime-watch-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        sleep 1;
      done;
      mc mb -p local/watch-together-media || true;
      mc anonymous set download local/watch-together-media;
      "

  roomserver:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    image: watch-together-roomserver:dev
    container_name: anime-watch-roomserver
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - nats
      - kafka
      - minio-init
    env_file:
      - .env
    environment:
      APP_ENV: local
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOG_LEVEL: debug
      SERVER_INSTANCE_ID: ${SERVER_INSTANCE_ID:-local-roomserver-1}
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      DEBUG_SYNC: "true"
      WS_CROSS_INSTANCE_BROADCAST_ENABLED: ${WS_CROSS_INSTANCE_BROADCAST_ENABLED:-false}
      WS_EVENT_BUS: ${WS_EVENT_BUS:-nats_core}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_NAME: ${NATS_NAME:-watch-together-roomserver}
      NATS_SUBJECT_ROOM_BROADCAST: ${NATS_SUBJECT_ROOM_BROADCAST:-wt.room.broadcast.v1}
      NATS_SUBJECT_ROOM_CONTROL: ${NATS_SUBJECT_ROOM_CONTROL:-wt.room.control.v1}
      CONTROL_IDEMPOTENCY_TTL_MS: ${CONTROL_IDEMPOTENCY_TTL_MS:-600000}
      PRESENCE_LEASE_TTL_MS: ${PRESENCE_LEASE_TTL_MS:-45000}
      PRESENCE_REFRESH_INTERVAL_MS: ${PRESENCE_REFRESH_INTERVAL_MS:-15000}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-roomserver}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      AUTHORITY_RENEW_INTERVAL_MS: ${AUTHORITY_RENEW_INTERVAL_MS:-10000}
      AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS: ${AUTHORITY_TAKEOVER_SCAN_INTERVAL_MS:-30000}
      AUTHORITY_RECOVERY_TIMEOUT_MS: ${AUTHORITY_RECOVERY_TIMEOUT_MS:-5000}
      KAFKA_REPLAY_TIMEOUT_MS: ${KAFKA_REPLAY_TIMEOUT_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${ROOMSERVER_METRICS_ADDR:-}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
      READINESS_PATH: ${READINESS_PATH:-/readyz}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-watch_together_local_dev_jwt_secret_change_me}
      DATABASE_URL: postgres://app:app@postgres:5432/anime_watch_dev?sslmode=disable
      REDIS_ADDR: redis:6380
      REDIS_PASSWORD: ${REDIS_PASSWORD:-watch_together_redis_dev}
      REDIS_DB: 0
      REDIS_REQUIRED: "false"
      MEDIA_DELIVERY_MODE: ${MEDIA_DELIVERY_MODE:-nginx_auth_request}
      MEDIA_PLAYBACK_SIGNING_SECRET: ${MEDIA_PLAYBACK_SIGNING_SECRET:-watch_together_local_dev_media_playback_secret_change_me}
      MEDIA_INTERNAL_BASE_URL: http://minio:9000/watch-together-media
      MEDIA_STORAGE_ENDPOINT: http://minio:9000
      MEDIA_STORAGE_BUCKET: watch-together-media
      MEDIA_STORAGE_REGION: auto
      MEDIA_STORAGE_ACCESS_KEY_ID: minioadmin
      MEDIA_STORAGE_SECRET_ACCESS_KEY: minioadmin
      MEDIA_STORAGE_FORCE_PATH_STYLE: "true"

  outboxworker:
    profiles: ["app"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-outboxworker
    restart: unless-stopped
    depends_on:
      - postgres
      - kafka
    env_file:
      - .env
    environment:
      APP_ENV: local
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      DATABASE_URL: postgres://app:app@postgres:5432/anime_watch_dev?sslmode=disable
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-outboxworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      OUTBOX_WORKER_BATCH_SIZE: ${OUTBOX_WORKER_BATCH_SIZE:-50}
      OUTBOX_WORKER_POLL_INTERVAL_MS: ${OUTBOX_WORKER_POLL_INTERVAL_MS:-1000}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${OUTBOX_WORKER_METRICS_ADDR:-:9091}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
    command: ["/app/outboxworker"]

  derivedworker:
    profiles: ["app"]
    image: watch-together-roomserver:dev
    container_name: anime-watch-derivedworker
    restart: unless-stopped
    depends_on:
      - kafka
    env_file:
      - .env
    environment:
      APP_ENV: local
      ROOM_RUNTIME_MODE: ${ROOM_RUNTIME_MODE:-local_process}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-watch-together-derivedworker}
      KAFKA_TOPIC_ROOM_TIMELINE: ${KAFKA_TOPIC_ROOM_TIMELINE:-wt.room.timeline.v1}
      KAFKA_TOPIC_ROOM_CONTROL_RESULT: ${KAFKA_TOPIC_ROOM_CONTROL_RESULT:-wt.room.control_result.v1}
      KAFKA_TOPIC_ROOM_MEMBERSHIP: ${KAFKA_TOPIC_ROOM_MEMBERSHIP:-wt.room.membership.v1}
      KAFKA_DERIVED_CONSUMER_GROUP_ID: ${KAFKA_DERIVED_CONSUMER_GROUP_ID:-watch-together-derived-workers}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ADDR: ${DERIVED_WORKER_METRICS_ADDR:-:9093}
      METRICS_PATH: ${METRICS_PATH:-/metrics}
    command: ["/app/derivedworker"]

  nginx:
    profiles: ["app"]
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    image: watch-together-nginx:dev
    container_name: anime-watch-nginx
    restart: unless-stopped
    depends_on:
      - roomserver
      - minio
    ports:
      - "8080:80"

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
