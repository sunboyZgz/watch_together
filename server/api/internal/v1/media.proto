syntax = "proto3";

package watch_together.internal.v1;

import "server/api/internal/v1/common.proto";

option go_package = "watch_together/server/internal/rpcgen/v1;internalv1";

service MediaInternalService {
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SearchItems(SearchItemsRequest) returns (SearchItemsResponse);
  rpc GetPlaybackItem(GetPlaybackItemRequest) returns (GetPlaybackItemResponse);
  rpc AuthorizePlayback(AuthorizePlaybackRequest) returns (AuthorizePlaybackResponse);
  rpc GetEpisodeDetail(GetEpisodeDetailRequest) returns (GetEpisodeDetailResponse);
  rpc ValidatePlayableEpisode(ValidatePlayableEpisodeRequest) returns (ValidatePlayableEpisodeResponse);
  rpc BatchGetEpisodeSummaries(BatchGetEpisodeSummariesRequest) returns (BatchGetEpisodeSummariesResponse);
}

message ListTagsRequest {
  RequestMetadata metadata = 1;
  int32 all_limit = 2;
}

message ListTagsResponse {
  repeated MediaTag featured_tags = 1;
  repeated MediaTag all_tags = 2;
}

message SearchItemsRequest {
  RequestMetadata metadata = 1;
  MediaSearchParams params = 2;
}

message SearchItemsResponse {
  repeated MediaItem items = 1;
}

message GetPlaybackItemRequest {
  RequestMetadata metadata = 1;
  string episode_id = 2;
}

message GetPlaybackItemResponse {
  PlaybackItem item = 1;
}

message AuthorizePlaybackRequest {
  RequestMetadata metadata = 1;
  string episode_id = 2;
  string asset_path = 3;
}

message AuthorizePlaybackResponse {
  bool authorized = 1;
}

message GetEpisodeDetailRequest {
  RequestMetadata metadata = 1;
  string episode_id = 2;
}

message GetEpisodeDetailResponse {
  EpisodeDetail episode = 1;
}

message ValidatePlayableEpisodeRequest {
  RequestMetadata metadata = 1;
  string episode_id = 2;
}

message ValidatePlayableEpisodeResponse {
  string episode_id = 1;
  bool playable = 2;
}

message BatchGetEpisodeSummariesRequest {
  RequestMetadata metadata = 1;
  repeated string episode_ids = 2;
}

message BatchGetEpisodeSummariesResponse {
  repeated EpisodeSummary episodes = 1;
}

message MediaTag {
  string id = 1;
  string slug = 2;
  string name = 3;
}

message MediaItemTag {
  string slug = 1;
  string name = 2;
}

message MediaItem {
  string id = 1;
  string title = 2;
  optional string subtitle = 3;
  optional string description = 4;
  optional string cover_url = 5;
  string media_url = 6;
  optional int64 duration_ms = 7;
  optional string season_label = 8;
  optional string episode_label = 9;
  repeated MediaItemTag tags = 10;
}

message PlaybackItem {
  string id = 1;
  string media_url = 2;
}

message EpisodeDetail {
  string id = 1;
  string title = 2;
  optional string subtitle = 3;
  string media_url = 4;
  optional int64 duration_ms = 5;
  optional string season_label = 6;
  optional string episode_label = 7;
}

message EpisodeSummary {
  string id = 1;
  string title = 2;
  optional string cover_url = 3;
}

message MediaSearchParams {
  string query = 1;
  string tag = 2;
  int32 limit = 3;
  int32 offset = 4;
}
