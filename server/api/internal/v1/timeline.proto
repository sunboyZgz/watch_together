syntax = "proto3";

package watch_together.internal.v1;

import "server/api/internal/v1/common.proto";

option go_package = "watch_together/server/internal/rpcgen/v1;internalv1";

service TimelineInternalService {
  rpc RecordTimelineEvent(RecordTimelineEventRequest) returns (RecordTimelineEventResponse);
  rpc ListRoomEvents(ListRoomEventsRequest) returns (ListRoomEventsResponse);
  rpc ListUnpublishedRoomEvents(ListUnpublishedRoomEventsRequest) returns (ListUnpublishedRoomEventsResponse);
}

message RecordTimelineEventRequest {
  RequestMetadata metadata = 1;
  TimelineEvent event = 2;
}

message RecordTimelineEventResponse {
  bool recorded = 1;
}

message ListRoomEventsRequest {
  RequestMetadata metadata = 1;
  string room_id = 2;
}

message ListRoomEventsResponse {
  repeated TimelineEvent events = 1;
}

message ListUnpublishedRoomEventsRequest {
  RequestMetadata metadata = 1;
  string room_id = 2;
}

message ListUnpublishedRoomEventsResponse {
  repeated TimelineEvent events = 1;
}

message TimelineEvent {
  string event_id = 1;
  int32 event_version = 2;
  string event_type = 3;
  string room_id = 4;
  string user_id = 5;
  string device_id = 6;
  string connection_id = 7;
  string instance_id = 8;
  string control_type = 9;
  int64 seq = 10;
  int64 occurred_at_ms = 11;
  bytes payload = 12;
}
